# Per-colleague machine limits, applied to every claude-agent@<name> (the admin's claude-agent.service is exempt).
# Sized for 3-5 colleagues on a 4 vCPU / 16 GB box: one person's builds cannot starve the others. 4 GB covers an
# agent serving several sessions (up to 5, see agent-sessions.conf); claudeagents.slice caps all of them, and
# every scheduled job, at 12 GB together, so the box keeps room for itself and Docker.
# Override one person: sudo systemctl edit claude-agent@<name>   (a drop-in there beats this file).
# Not covered: Docker containers run under docker.service, not in this cgroup (see the handoff).
[Service]
MemoryHigh=3584M
MemoryMax=4G
CPUQuota=150%
TasksMax=1500
IOWeight=50
