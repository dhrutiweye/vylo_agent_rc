# How many Claude sessions each person's agent may serve at once. Read by agent-run, the guard, the Chat bridge
# and the jobs runner through `agent-max-sessions`. Root-owned, mode 644. Change it with `sessions-enable NAME`
# (which checks the person's repo copies first), not by hand.
#
#   default=N     everyone without a line of their own
#   name=N        one person (their Linux user name)
#
# N is 1..5; anything outside is clamped, anything unreadable is ignored. 1 is the single-session agent of
# before. A person whose Claude org pushes a policy without "managedSourcesBehavior": "merge" always gets 1,
# whatever this file says: Claude would skip the box's guard for them.
default=1
